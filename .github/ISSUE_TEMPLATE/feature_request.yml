name: Feature request
description: Suggest an improvement or a new capability.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you would like it to work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: principles
    attributes:
      label: Project principles
      description: baqueano keeps tools read-only by default and user data inside the user's account.
      options:
        - label: This proposal keeps tools read-only by default, or explains why write access is needed and how it is opted into.
        - label: This proposal does not send user data or telemetry outside the user's account by default.
