name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-machete
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo deny check
      - run: cargo machete

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      # Offline fixture checks (no Docker, no network): helper unit tests + committed stores.
      - run: python3 -I -m unittest discover -s scripts/fixtures -p 'test_*.py'
      - run: python3 -I scripts/fixtures/check.py fixtures/lineage

  # Named status check for `nextflow lineage` parity against the committed fixtures/lineage oracles
  # (no Docker, no network beyond crates.io, no secrets). `test` runs the same suite.
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p nf-lineage --test contract --locked

  # S3 integration tests against MiniStack (an AWS emulator). The tests use fixed dummy
  # credentials (`test`/`test`) and their own buckets; no secrets are involved.
  integration:
    runs-on: ubuntu-latest
    services:
      ministack:
        image: ministackorg/ministack:1.5.45
        ports:
          - 4566:4566
    env:
      NF_LINEAGE_MINISTACK_URL: http://localhost:4566
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p nf-lineage --test s3_ministack --locked

  # Builds the image (never pushed) and runs the example pipeline offline against it.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: docker build -f crates/nf-llm-replay/Dockerfile -t nf-llm-replay:ci .
      - name: Image runs as 65532:65532 and is at most 25 MB
        run: |
          user=$(docker image inspect nf-llm-replay:ci --format '{{.Config.User}}')
          size=$(docker image inspect nf-llm-replay:ci --format '{{.Size}}')
          echo "user=$user size=$size"
          test "$user" = "65532:65532"
          test "$size" -le 26214400
      - run: docker run --rm nf-llm-replay:ci --help
      - run: docs/examples/nf-llm-replay/e2e.sh
        env:
          E2E_REQUIRE_DOCKER: "1"
          IMAGE: nf-llm-replay:ci
