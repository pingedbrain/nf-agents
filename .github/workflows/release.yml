name: release

# Runs only for a version tag (v0.1.0, v0.1.0-rc.1). Nothing here runs on pull requests.
on:
  push:
    tags: ['v*']

permissions: {}

# Never cancel a run in the middle of a publish.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: rustup toolchain install
      - name: Metadata and tag match
        run: scripts/release/check.sh "$GITHUB_REF_NAME"

  crates:
    needs: check
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Trusted Publishing is the default. A long-lived token is used only as a bootstrap
      # fallback while the crates have no trusted publisher yet.
      - name: Detect bootstrap token
        id: token
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "$CARGO_REGISTRY_TOKEN" ]; then
            echo "bootstrap=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Authenticate with crates.io
        id: auth
        if: steps.token.outputs.bootstrap != 'true'
        uses: rust-lang/crates-io-auth-action@v1
      - run: rustup toolchain install
      - name: Publish workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --workspace --locked

  images:
    needs: crates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      matrix:
        crate: [baqueano-mcp, baqueano-replay]
    env:
      CRATE: ${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Compute version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Build
        run: |
          image="ghcr.io/pingedbrain/$CRATE"
          tags=(-t "$image:$VERSION")
          if [[ "$VERSION" != *-* ]]; then
            tags+=(-t "$image:latest")
          fi
          docker build -f "crates/$CRATE/Dockerfile" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            "${tags[@]}" .
      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Push
        id: push
        run: |
          image="ghcr.io/pingedbrain/$CRATE"
          docker push --all-tags "$image"
          digest=$(docker buildx imagetools inspect "$image:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/pingedbrain/${{ matrix.crate }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  release:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Create GitHub Release
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${args[@]}"
