# cargo-deny policy (cargo-deny 0.22). Run: cargo deny check

[graph]
# Platforms baqueano ships for; others (e.g. Android-only `jni` via rustls-platform-verifier) are skipped.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[advisories]
# Known vulnerabilities are always errors; yanked crates too.
yanked = "deny"
ignore = [
    # Informational "unmaintained" notices for object_store's transitive deps (no fix exists;
    # object_store pins them). cargo-deny 0.22 only reports unmaintained crates the workspace
    # depends on directly, older releases report all: keep the ignores explicit for both.
    { id = "RUSTSEC-2026-0542", reason = "humantime unmaintained; transitive via object_store, no patched version" },
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained; transitive via object_store, no patched version" },
]

[licenses]
# Permissive licenses compatible with Apache-2.0 only (no GPL/LGPL/AGPL/SSPL).
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # webpki-root-certs (Mozilla CA bundle data, via reqwest rustls); permissive data license.
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8
# Mozilla's CA root data (data license, permissive); only this crate, via object_store/reqwest.
exceptions = [{ crate = "webpki-root-certs", allow = ["CDLA-Permissive-2.0"] }]
# Not every allowed license is in use yet.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Intra-workspace path dependencies are fine.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
