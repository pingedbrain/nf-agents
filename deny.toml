# cargo-deny policy (cargo-deny 0.22). Run: cargo deny check

[advisories]
# Known vulnerabilities are always errors; yanked crates too.
yanked = "deny"

[licenses]
# Permissive licenses compatible with Apache-2.0 only (no GPL/LGPL/AGPL/SSPL).
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8
# Not every allowed license is in use yet.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Intra-workspace path dependencies are fine.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
