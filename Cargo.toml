[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/pingedbrain/baqueano"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"

# Shared dependency versions (crates opt in with `<dep>.workspace = true`).
# Only list dependencies some crate uses: cargo warns about unused entries.
[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8.9"
clap = { version = "4.6", features = ["derive", "env"] }
futures = "0.3"
futures-util = { version = "0.3.34", default-features = false }
insta = { version = "1.49", features = ["json"] }
murmur3 = "0.5"
object_store = "0.14"
regex = "1.13"
# No default features: rustls (aws-lc-rs) TLS, no gzip (stored bytes stay plain), no system proxy.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "stream"] }
rmcp = { version = "3.12", default-features = false }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.11.2"
similar = "2"
tempfile = "3.27"
thiserror = "2"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "fs", "io-util"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter"] }
url = "2"
