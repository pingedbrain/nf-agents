[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/pingedbrain/nf-agents"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"

# Shared dependency versions (crates opt in with `<dep>.workspace = true`).
# Only list dependencies some crate uses: cargo warns about unused entries.
[workspace.dependencies]
anyhow = "1"
axum = "0.8.9"
clap = { version = "4.6", features = ["derive", "env"] }
regex = "1.13"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.11.2"
tempfile = "3.27"
thiserror = "2"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "signal"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter"] }
