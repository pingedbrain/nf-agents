[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/pingedbrain/nf-agents"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"

# Add-as-used: only what some crate depends on (cargo warns on unused entries).
[workspace.dependencies]
async-trait = "0.1"
futures = "0.3"
insta = { version = "1.49", features = ["json"] }
murmur3 = "0.5"
object_store = "0.14"
regex = "1"
rmcp = { version = "3.12", default-features = false }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
url = "2"
